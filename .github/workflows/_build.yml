name: _build

on:
  workflow_call:
    inputs:
      publish:
        description: "Build artifacts and publish a release"
        type: boolean
        default: false
      version:
        description: "Release version (e.g. nightly or v1.2.3)"
        type: string
        default: ""

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      # Code behind a build constraint only compiles for its own platform, so
      # the Windows half of each split would otherwise go unchecked here.
      - name: Run go vet for Windows
        run: GOOS=windows go vet ./... && GOOS=windows go vet -tags integration ./integration/...

      # The integration suite is behind a build tag, so a plain "go vet ./..."
      # never compiles it. Without this, it can rot unnoticed until someone
      # brings up Docker.
      - name: Vet the integration suite
        run: go vet -tags integration ./integration/...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall

  # The workspace is prepared once, and every job after this one builds it, so
  # what is tested is what is released.
  prepare:
    name: Prepare the gaia workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install gaia
        run: |
          . packaging/versions.env
          go install "github.com/cs3org/gaia@$GAIA_VERSION"

      # gaia calls api.github.com without a token, and panics when the call
      # fails. A shared runner can run out of its calls, so retry once.
      - name: Prepare
        run: packaging/prepare.sh || { sleep 60; packaging/prepare.sh; }

      - uses: actions/upload-artifact@v7
        with:
          name: workspace
          path: ws/
          if-no-files-found: error

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel covers amd64.
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    defaults:
      run:
        # Git Bash on Windows, so the smoke test is one script everywhere; it
        # finds cernbox.exe when asked for ./cernbox.
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: workspace
          path: ws

      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/go.mod
          cache-dependency-path: ws/go.sum

      - name: Build
        working-directory: ws
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w $(cat bflags)" -o ../cernbox${{ runner.os == 'Windows' && '.exe' || '' }} .

      # A binary that cannot print its own help is broken in a way no unit test
      # would catch: cobra panics on a duplicate flag shorthand at startup, not
      # at compile time. The version and the brand check catch a build that
      # lost the ldflags or the embedded brand.
      - name: Smoke test
        run: |
          ./cernbox version --plugins | tee version.txt
          grep -q '^version=[^ ]' version.txt
          grep -q '^brand=cernbox ' version.txt
          ./cernbox --help
          ./cernbox ls --help
          ./cernbox completion bash > /dev/null

  # ── Unit tests ───────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      # Each platform's result stands on its own: a failure on one should not
      # cancel the others and hide whether they pass.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    defaults:
      run:
        # PowerShell would split -coverprofile=coverage.out at the dot.
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.out

  # ── Integration tests ────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: workspace
          path: ws

      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/go.mod
          cache-dependency-path: |
            go.sum
            ws/go.sum

      # The suite tests the binary that the release ships.
      - name: Build cernbox
        working-directory: ws
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w $(cat bflags)" -o ../cernbox .

      # The EOS image alone is over 6GB, and a runner has around 14GB free, so
      # the stack fills the disk and EOS then fails every write with "no space
      # left on device" rather than anything that points at the real cause.
      # None of what is removed here is used by this job.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      # kinit and klist. The Kerberos tests drive the real client tools rather
      # than a Go-only approximation, because what has to work on lxplus is a
      # ticket that kinit put in the cache.
      - name: Install the Kerberos client tools
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq krb5-user

      - name: Start dev services
        run: docker compose -f dev/docker-compose.yaml up -d --build

      - name: Wait for revad
        run: ./dev/wait-for-revad.sh

      - name: Report disk space
        run: df -h /

      - name: Run integration tests
        # A missing realm makes the Kerberos tests skip, and a skip in CI reads
        # as a pass. Here the realm is always present, so demand it.
        env:
          CERNBOX_REQUIRE_KERBEROS: "1"
        run: CERNBOX_BINARY="$PWD/cernbox" go test -tags integration -count=1 -timeout 20m ./integration/...

      # The revad and EOS logs are the only way to tell a client bug from a
      # server one when a test fails, and the containers are gone by the time
      # anyone looks.
      - name: Dump service logs
        if: failure()
        run: |
          echo "=== disk ==="
          df -h /
          echo "=== revad ==="
          docker compose -f dev/docker-compose.yaml logs --tail=200 revad
          echo "=== revad-partner ==="
          docker compose -f dev/docker-compose.yaml logs --tail=200 revad-partner
          echo "=== eos-storage ==="
          docker compose -f dev/docker-compose.yaml logs --tail=100 eos-storage
          echo "=== kdc ==="
          docker compose -f dev/docker-compose.yaml logs --tail=100 kdc

      - name: Stop dev services
        if: always()
        run: docker compose -f dev/docker-compose.yaml down -v

  # ── Release ──────────────────────────────────────────────────────────────────
  release:
    name: Release
    if: inputs.publish
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: workspace
          path: ws

      - uses: actions/setup-go@v6
        with:
          go-version-file: ws/go.mod
          cache-dependency-path: ws/go.sum

      # goreleaser puts these in the ldflags of every build (.goreleaser.yaml).
      - name: Read the version flags of the workspace
        run: echo "BFLAGS=$(cat ws/bflags)" >> "$GITHUB_ENV"

      - name: Move the nightly tag to this commit
        if: inputs.version == 'nightly'
        run: |
          git tag -f nightly
          git push origin nightly --force

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release --clean
            ${{ inputs.version == 'nightly' && '--snapshot --skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the nightly pre-release
        if: inputs.version == 'nightly'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          make_latest: false
          body: "Built from commit ${{ github.sha }}"
          # What a user downloads, and nothing of goreleaser's working files.
          # dist/**/* also took the loose binary out of every build directory:
          # all named cernbox, so the release ended up with whichever was
          # uploaded last, for an architecture nothing said.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.rpm
            dist/*.deb
            dist/checksums.txt
