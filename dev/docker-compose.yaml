volumes:
  # The KDC writes the service keytab and the client krb5.conf here; revad
  # mounts the same volume to read them.
  krb5-share:

services:
  # The Kerberos realm. Native Kerberos cannot be tested without one.
  kdc:
    build:
      context: .
      dockerfile: Dockerfile.kdc
    ports:
      - "8088:88/udp"
      - "8088:88/tcp"
    volumes:
      - krb5-share:/krb5-share
    healthcheck:
      # revad refuses to start without the keytab, so it waits for this.
      test: ["CMD", "test", "-f", "/krb5-share/service.keytab"]
      interval: 2s
      timeout: 2s
      retries: 30

  eos-storage:
    build:
      context: .
      dockerfile: Dockerfile.eos
    ulimits:
      nproc: 57875
      nofile: 1024000
      core: -1
    healthcheck:
      # Both checks matter: the MGM answers well before the gRPC server is
      # listening, and revad dies on startup if it cannot reach gRPC.
      test: ["CMD-SHELL", "eos file info /eos/user && ss -lnt | grep -q ':50051'"]
      interval: 10s
      timeout: 5s

  # The CERNBox under test.
  revad:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Published on 443 because the service speaks TLS now, and the tests
      # address it as https://localhost with no port.
      - "443:443"
    tmpfs:
      # Mounted at /var/tmp/reva, not /var/tmp: every file-backed driver writes
      # under this path, and a tmpfs at the parent would shadow it away empty.
      - /tmp:size=256m,mode=1777
      - /var/tmp/reva:size=64m,mode=1777
    volumes:
      - ./revad:/etc/revad:ro
      - ./pki:/etc/pki:ro
      - krb5-share:/krb5-share:ro
    environment:
      - SSL_CERT_FILE=/etc/pki/ca.crt
      - KRB5_CONFIG=/krb5-share/krb5.conf
    command: -c /etc/revad/cernbox.toml
    depends_on:
      eos-storage:
        condition: service_healthy
      kdc:
        condition: service_healthy

  # The federation partner. Federated sharing needs two providers that trust
  # each other, so the OCM commands have somewhere to send an invitation and a
  # share. It runs on a local filesystem rather than EOS: its job is to be the
  # far end, not to be a second CERNBox.
  revad-partner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:443"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/tmp/reva:size=64m,mode=1777
    volumes:
      - ./revad:/etc/revad:ro
      - ./pki:/etc/pki:ro
    environment:
      - SSL_CERT_FILE=/etc/pki/ca.crt
    command: -c /etc/revad/partner.toml
