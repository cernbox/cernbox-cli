## Dev configuration with a minimal setup for CERNBox

[vars]
internal_gateway = "revad"
provider_domain = "revad"
machine_api_key = "machine-api-key"

[http]

[log]
level = "debug"

[shared]
gatewaysvc = "{{ vars.internal_gateway }}:19000"
jwt_secret = "reva-secret"

[grpc.services.gateway]
address = ":19000"
authregistrysvc = "{{ grpc.services.authregistry.address }}"
appregistrysvc = "{{ grpc.services.appregistry.address }}"
ocminvitemanagersvc = "{{ grpc.services.ocminvitemanager.address }}"
ocmproviderauthorizersvc = "{{ grpc.services.ocmproviderauthorizer.address }}"
ocmshareprovidersvc = "{{ grpc.services.ocmshareprovider.address }}"
storageregistrysvc = "{{ grpc.services.storageregistry.address }}"
preferencessvc = "{{ grpc.services.userprovider.address }}"
userprovidersvc = "{{ grpc.services.userprovider.address }}"
usershareprovidersvc = "{{ grpc.services.usershareprovider.address }}"
publicshareprovidersvc = "{{ grpc.services.publicshareprovider.address }}"
groupprovidersvc = "{{ grpc.services.groupprovider.address }}"
spacessvc = "{{ grpc.services.spacesregistry.address }}"
datagateway = "http://{{ http.services.datagateway.address }}/data"

transfer_expires = 6     # give it a moment
commit_share_to_storage_grant = true
commit_share_to_storage_ref = true

home_layout = "/eos/user/{{substr 0 1 .Username}}/{{.Username}}/"

### AUTH ###

[grpc.services.authregistry]
driver = "static"

[grpc.services.authregistry.drivers.static.rules]
basic = "{{ grpc.services.authprovider[0].address }}"
bearer = "{{ grpc.services.authprovider[0].address }}"
machine = "{{ grpc.services.authprovider[1].address }}"
ocmshares = "{{ grpc.services.authprovider[2].address }}"
kerberos = "{{ grpc.services.authprovider[3].address }}"

[[grpc.services.authprovider]]
auth_manager = "json"

[grpc.services.authprovider.auth_managers.json]
users = "/etc/revad/users.demo.json"

[[grpc.services.authprovider]]
auth_manager = "machine"

[grpc.services.authprovider.auth_managers.machine]
api_key = "{{ vars.machine_api_key }}"
gateway_addr = "{{ vars.internal_gateway }}:19000"

[[grpc.services.authprovider]]
auth_manager = "ocmshares"

[grpc.services.authprovider.auth_managers.ocmshares]

# Native Kerberos: a client with a ticket authenticates here directly, with no
# identity provider in between. The keytab comes from the kdc container through
# a shared volume.
[[grpc.services.authprovider]]
auth_manager = "kerberos"

[grpc.services.authprovider.auth_managers.kerberos]
keytab = "/krb5-share/service.keytab"
service_principal = "HTTP/revad"
realm = "TEST.CERN.CH"
user_claim = "username"


### STORAGE ###

[grpc.services.storageregistry]
driver = "static"

[grpc.services.storageregistry.drivers.static]
home_provider = "/"

[grpc.services.storageregistry.drivers.static.rules]
"/" = {"address" = "{{ grpc.services.storageprovider[0].address }}"}
"localhome" = {"address" = "{{ grpc.services.storageprovider[0].address }}"}
# Shares received from another provider are mounted here, so that a federated
# share can be listed and read like any other path.
"/ocm" = {"address" = "{{ grpc.services.storageprovider[1].address }}"}
"ocm" = {"address" = "{{ grpc.services.storageprovider[1].address }}"}

[[grpc.services.storageprovider]]
driver = "eos"
mount_path = "/"
mount_id = "localhome"
expose_data_server = true
data_server_url = "http://localhost:{{ http.services.dataprovider[0].address.port }}/data"
enable_home_creation = true
space_depth = 4

[grpc.services.storageprovider.drivers.eos]
namespace = "/"
quota_node = "/eos/user"
user_layout = "{{substr 0 1 .Username}}/{{.Username}}"
use_grpc = true
gatewaysvc = "localhost:19000"
grpc_auth_key = "eos_auth_key"
https_auth_key = "eos_auth_key"
master_grpc_uri = "eos-storage:50051"
master_url = "https://eos-storage:8443" # I know it's wrong, but this is passed to the http layer like this...
allow_insecure = true
http_client_cafiles = "/etc/pki/ca.crt"

[[grpc.services.storageprovider]]
driver = "ocmoutcoming"
mount_path = "/ocm"
mount_id = "ocm"
space_depth = 2
expose_data_server = true
data_server_url = "http://localhost/data"

[grpc.services.storageprovider.drivers.ocmoutcoming]
machine_secret = "{{ vars.machine_api_key }}"

[grpc.services.spacesregistry]
driver = "memory"
user_space = "/eos/user/{{substr 0 1 .Username}}/{{ .Username }}"
machine_secret = "{{ vars.machine_api_key }}"

[grpc.services.spacesregistry.drivers.memory]
# Here the project spaces

### APPS ###

# The catalogue: how a mime type is presented and which app opens it. The
# providers themselves are discovered in the service registry, which the
# in-process memory driver shares across every service in this container.
[grpc.services.appregistry]

[[grpc.services.appregistry.mime_types]]
mime_type = "text/plain"
extension = "txt"
name = "Text file"
description = "Plain text document"
default_app = "demo-app"
allow_creation = true

[[grpc.services.appregistry.mime_types]]
mime_type = "text/markdown"
extension = "md"
name = "Markdown file"
description = "Markdown document"
default_app = "demo-app"
allow_creation = true

[[grpc.services.appregistry.mime_types]]
mime_type = "application/vnd.oasis.opendocument.text"
extension = "odt"
name = "OpenDocument"
description = "OpenDocument text document"
default_app = "demo-app"
allow_creation = true

[grpc.services.appprovider]
driver = "demo"
mime_types = ["text/plain", "text/markdown", "application/vnd.oasis.opendocument.text"]
language = "en"

[grpc.services.appprovider.drivers.demo]
iframe_ui_provider = "http://localhost/demo-app"

### OPEN CLOUD MESH ###

# Federated sharing. The partner instance in docker-compose is the other end;
# both sides read the same providers file, so each trusts the other.
[grpc.services.ocminvitemanager]
driver = "json"
provider_domain = "revad"

[grpc.services.ocminvitemanager.drivers.json]
file = "/var/tmp/reva/ocm-invites.json"

[grpc.services.ocmproviderauthorizer]
driver = "json"

[grpc.services.ocmproviderauthorizer.drivers.json]
providers = "/etc/revad/ocm-providers.json"

[grpc.services.ocmshareprovider]
driver = "json"
provider_domain = "revad"
webdav_endpoint = "http://revad"
webapp_endpoint = "http://revad/external/sciencemesh"

[grpc.services.ocmshareprovider.drivers.json]
file = "/var/tmp/reva/ocm-shares.json"

[grpc.services.ocmincoming]
driver = "json"

[grpc.services.ocmincoming.drivers.json]
file = "/var/tmp/reva/ocm-shares.json"

### OTHER PROVIDERS ###

# The sql driver on sqlite, not memory or json. The gateway probes the share
# manager for liveness with GetShare(id=0) and insists on an error that reads
# "not found: 0"; memory and json answer with the protobuf form of the whole
# reference, fail the probe, and every share then comes back 500.
[grpc.services.usershareprovider]
driver = "sql"

[grpc.services.usershareprovider.drivers.sql]
db_engine = "sqlite"
db_name = "/var/tmp/reva/shares.sqlite"

[grpc.services.publicshareprovider]
driver = "sql"

[grpc.services.publicshareprovider.drivers.sql]
db_engine = "sqlite"
db_name = "/var/tmp/reva/shares.sqlite"

# App tokens, which "cernbox token list" and "token revoke" go through.
[grpc.services.applicationauth]
driver = "json"

[grpc.services.applicationauth.drivers.json]
file = "/var/tmp/reva/app-tokens.json"

[grpc.services.preferences]

[grpc.services.userprovider]
driver = "json"

[grpc.services.userprovider.drivers.json]
users = "/etc/revad/users.demo.json"

[grpc.services.groupprovider]
driver = "json"

[grpc.services.groupprovider.drivers.json]
groups = "/etc/revad/groups.demo.json"


### HTTP ENDPOINTS ###

[http.middlewares.auth]
credential_chain = ["spnego", "publicshares", "basic", "bearer"]
token_strategy_chain = ["bearer", "header"]

[http.middlewares.auth.credentials_by_user_agent]
"mirall" = "basic"

[http.services.datagateway]
address = ":80"

[[http.services.dataprovider]]
driver = "eos"
insecure = true

[http.services.dataprovider.drivers.eos]
namespace = "/"
quota_node = "/eos/user"
user_layout = "{{substr 0 1 .Username}}/{{.Username}}"
use_grpc = true
gatewaysvc = "localhost:19000"
grpc_auth_key = "eos_auth_key"
https_auth_key = "eos_auth_key"
master_grpc_uri = "eos-storage:50051"
master_url = "https://eos-storage:8443" # I know it's wrong, but this is passed to the http layer like this...
allow_insecure = true
http_client_cafiles = "/etc/pki/ca.crt"

# OCS
[http.services.ocs]
address = ":80"
prefix = "ocs"
share_prefix = "/"
home_namespace = "/"
additional_info_attribute = "{{.Username}} ({{.Mail}})"
cache_warmup_driver = "first-request"
resource_info_cache_ttl = 60
resource_info_cache_type = "memory"

[http.services.ocs.config]
version = "1.8"
website = "reva"
host = "http://localhost"
contact = "cernbox@cernbox.org"
ssl = "false"

[http.services.ocs.capabilities.capabilities.core]
poll_interval = 60
webdav_root = "remote.php/webdav"
status = { installed = true, maintenance = false, nwwsaDbUpgrade = false, version = "10.0.11.5", versionstring = "10.0.11", edition = "community", productname = "reva", hostname = "" }
support_url_signing = false

[http.services.ocs.capabilities.capabilities.checksums]
supported_types = ["sha1", "md5", "adler32"]

[http.services.ocs.capabilities.capabilities.files]
private_links = false
bigfilechunking = false
blacklisted_files = []
undelete = true
versioning = true
archivers = [
  { enabled = true, version = "2.0.0", formats = [
    "tar",
    "zip",
  ], archiver_url = "/archiver", max_num_files = "10000", max_size = "1073741824" },
]
favorites = true

[http.services.ocs.capabilities.capabilities.dav]

[http.services.ocs.capabilities.capabilities.files_sharing]
api_enabled = true
resharing = true
deny_access = true
resharing_default = false
group_sharing = true
auto_accept_share = true
share_with_group_members_only = true
share_with_membership_groups_only = true
default_permissions = 22
search_min_length = 3

[http.services.ocs.capabilities.capabilities.files_sharing.public]
enabled = true
send_mail = true
social_share = true
upload = true
multiple = true
supports_upload_only = true
password = { enforced = false, enforced_for = { read_only = false, read_write = false, upload_only = false } }
expire_date = { enabled = true }
can_edit = true
can_contribute = false

[http.services.ocs.capabilities.capabilities.files_sharing.user]
send_mail = true
profile_picture = false
settings = [{ enabled = true, version = "1.0.0" }]

[http.services.ocs.capabilities.capabilities.files_sharing.user_enumeration]
enabled = true
group_members_only = true

[http.services.ocs.capabilities.capabilities.files_sharing.federation]
outgoing = true
incoming = true

[http.services.ocs.capabilities.capabilities.spaces]
enabled = true
projects = true

[http.services.ocs.capabilities.version]
edition = "reva"
major = 10
minor = 0
micro = 11
string = "10.0.11"

[http.services.ocdav]
address = ":80"
insecure = true
public_url = "http://localhost"
files_namespace = "/eos/{{substr 0 1 .Username}}"

[http.services.archiver]
address = ":80"
prefix = "archiver"
timeout = 300
insecure = true
max_num_files = 10000
max_size = 1073741824

[http.services.appprovider]
address = ":80"
prefix = "app"
insecure = true

[http.services.ocm]
address = ":80"

[http.services.sciencemesh]
address = ":80"
provider_domain = "revad"
mesh_directory_url = "http://revad/meshdir"
smtp_credentials = {}

[[http.services.dataprovider]]
driver = "ocmoutcoming"
mount_id = "ocm"
insecure = true

[http.services.dataprovider.drivers.ocmoutcoming]
machine_secret = "{{ vars.machine_api_key }}"

[http.services.wellknown]
address = ":80"

[http.services.wellknown.ocmprovider]
ocm_prefix = "ocm"
provider = "Reva for CERNBox (dev)"
endpoint = "http://revad"
enable_webapp = true

[http.middlewares.providerauthorizer]
driver = "json"

[http.middlewares.providerauthorizer.drivers.json]
providers = "/etc/revad/ocm-providers.json"

[http.services.ocapi]
address = ":80"

[http.services.ocgraph]
address = ":80"
base_url = "http://localhost"
# Without this, sharedWithMe silently leaves federated shares out.
ocm_enabled = true

[http.middlewares.cors]
allowed_origins = ["*"]
allowed_methods = ["OPTIONS", "LOCK", "GET", "HEAD", "POST", "DELETE", "PROPPATCH", "COPY", "MOVE", "UNLOCK", "PROPFIND", "MKCOL", "REPORT", "SEARCH", "PUT"]
allowed_headers = ["Accept", "Accept-Language", "Authorization", "Content-Language", "Content-Type", "Depth", "OCS-APIREQUEST", "Referer", "sec-ch-ua", "sec-ch-ua-mobile", "sec-ch-ua-platform", "User-Agent", "X-Requested-With"]
debug = true
exposed_headers = []

[http.middlewares.log]
level = "debug"
