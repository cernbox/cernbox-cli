## The federation partner.
##
## Federated sharing needs two providers that trust each other, so this is a
## second, deliberately minimal reva: no EOS, a local filesystem for storage,
## and only the services an OCM peer has to answer. Its job is to be the far
## end of an invitation and of a share — enough that the CLI's ocm commands can
## be tested for real rather than tested for their error messages.

[vars]
machine_api_key = "machine-api-key"

[http]
# TLS, because OCM requires it between providers: reva's discovery client
# forces https for any peer that is not localhost, so a plain-http dev instance
# can never receive a federated share. The certs are signed by the dev CA that
# both containers already trust.
certfile = "/etc/pki/revad-partner.crt"
keyfile = "/etc/pki/revad-partner.key"

[log]
level = "debug"

[shared]
gatewaysvc = "revad-partner:19000"
jwt_secret = "partner-secret"

[shared.registry]
driver = "memory"

[grpc.services.gateway]
address = ":19000"
authregistrysvc = "{{ grpc.services.authregistry.address }}"
storageregistrysvc = "{{ grpc.services.storageregistry.address }}"
preferencessvc = "{{ grpc.services.userprovider.address }}"
userprovidersvc = "{{ grpc.services.userprovider.address }}"
groupprovidersvc = "{{ grpc.services.groupprovider.address }}"
usershareprovidersvc = "{{ grpc.services.usershareprovider.address }}"
publicshareprovidersvc = "{{ grpc.services.publicshareprovider.address }}"
ocminvitemanagersvc = "{{ grpc.services.ocminvitemanager.address }}"
ocmproviderauthorizersvc = "{{ grpc.services.ocmproviderauthorizer.address }}"
ocmshareprovidersvc = "{{ grpc.services.ocmshareprovider.address }}"
spacessvc = "{{ grpc.services.spacesregistry.address }}"
datagateway = "https://{{ http.services.datagateway.address }}/data"

# With the localhome driver the home is the mount path itself: the driver maps
# it to the caller's own directory. Templating a username in here as well would
# ask for <root>/data/alice/alice, which is nobody's home.
home_layout = "/home"

### AUTH ###

[grpc.services.authregistry]
driver = "static"

[grpc.services.authregistry.drivers.static.rules]
basic = "{{ grpc.services.authprovider[0].address }}"
bearer = "{{ grpc.services.authprovider[0].address }}"
machine = "{{ grpc.services.authprovider[1].address }}"
ocmshares = "{{ grpc.services.authprovider[2].address }}"

[[grpc.services.authprovider]]
auth_manager = "json"

[grpc.services.authprovider.auth_managers.json]
users = "/etc/revad/partner-users.json"

[[grpc.services.authprovider]]
auth_manager = "machine"

[grpc.services.authprovider.auth_managers.machine]
api_key = "{{ vars.machine_api_key }}"
gateway_addr = "revad-partner:19000"

[[grpc.services.authprovider]]
auth_manager = "ocmshares"

[grpc.services.authprovider.auth_managers.ocmshares]

### STORAGE ###

[grpc.services.storageregistry]
driver = "static"

[grpc.services.storageregistry.drivers.static]
home_provider = "/home"

[grpc.services.storageregistry.drivers.static.rules]
"/home" = {"address" = "{{ grpc.services.storageprovider[0].address }}"}
"partnerhome" = {"address" = "{{ grpc.services.storageprovider[0].address }}"}
"/ocm" = {"address" = "{{ grpc.services.storageprovider[1].address }}"}
"ocm" = {"address" = "{{ grpc.services.storageprovider[1].address }}"}

# A home is needed even though nobody stores anything here: the gateway creates
# one as part of authenticating, and without somewhere to create it every
# request comes back 401.
[[grpc.services.storageprovider]]
driver = "localhome"
mount_path = "/home"
mount_id = "partnerhome"
expose_data_server = true
data_server_url = "https://localhost/data"
enable_home_creation = true

[grpc.services.storageprovider.drivers.localhome]
root = "/var/tmp/reva/partner"
user_layout = "{{.Username}}"

# Where shares received from the other provider are mounted.
[[grpc.services.storageprovider]]
driver = "ocmoutcoming"
mount_path = "/ocm"
mount_id = "ocm"
space_depth = 2
expose_data_server = true
data_server_url = "https://localhost/data"

[grpc.services.storageprovider.drivers.ocmoutcoming]
machine_secret = "{{ vars.machine_api_key }}"

[grpc.services.spacesregistry]
driver = "memory"
user_space = "/home"
machine_secret = "{{ vars.machine_api_key }}"

[grpc.services.spacesregistry.drivers.memory]

### OPEN CLOUD MESH ###

[grpc.services.ocminvitemanager]
driver = "json"
provider_domain = "revad-partner"

[grpc.services.ocminvitemanager.drivers.json]
file = "/var/tmp/reva/partner-ocm-invites.json"

[grpc.services.ocmproviderauthorizer]
driver = "json"

[grpc.services.ocmproviderauthorizer.drivers.json]
providers = "/etc/revad/ocm-providers.json"

[grpc.services.ocmshareprovider]
driver = "json"
provider_domain = "revad-partner"
webdav_endpoint = "https://revad-partner"
webapp_endpoint = "https://revad-partner/external/sciencemesh"

[grpc.services.ocmshareprovider.drivers.json]
file = "/var/tmp/reva/partner-ocm-shares.json"

[grpc.services.ocmincoming]
driver = "json"

[grpc.services.ocmincoming.drivers.json]
file = "/var/tmp/reva/partner-ocm-shares.json"

### OTHER PROVIDERS ###

[grpc.services.usershareprovider]
driver = "memory"

[grpc.services.publicshareprovider]
driver = "memory"

[grpc.services.preferences]

[grpc.services.userprovider]
driver = "json"

[grpc.services.userprovider.drivers.json]
users = "/etc/revad/partner-users.json"

[grpc.services.groupprovider]
driver = "json"

[grpc.services.groupprovider.drivers.json]
groups = "/etc/revad/partner-groups.json"

### HTTP ENDPOINTS ###

[http.middlewares.auth]
credential_chain = ["publicshares", "basic", "bearer"]
token_strategy_chain = ["bearer", "header"]

[http.middlewares.providerauthorizer]
driver = "json"

[http.middlewares.providerauthorizer.drivers.json]
providers = "/etc/revad/ocm-providers.json"

[http.middlewares.cors]
allowed_origins = ["*"]

[http.services.datagateway]
address = ":443"

[[http.services.dataprovider]]
driver = "localhome"
mount_id = "partnerhome"

[http.services.dataprovider.drivers.localhome]
root = "/var/tmp/reva/partner"
user_layout = "{{.Username}}"

[[http.services.dataprovider]]
driver = "ocmoutcoming"
mount_id = "ocm"
insecure = true

[http.services.dataprovider.drivers.ocmoutcoming]
machine_secret = "{{ vars.machine_api_key }}"

# The machine-to-machine OCM API the other provider calls.
[http.services.ocm]
address = ":443"

# The user-facing side, which the CLI talks to.
[http.services.sciencemesh]
address = ":443"
provider_domain = "revad-partner"
mesh_directory_url = "https://revad-partner/meshdir"
smtp_credentials = {}

[http.services.wellknown]
address = ":443"

[http.services.wellknown.ocmprovider]
ocm_prefix = "ocm"
provider = "Partner Lab (dev)"
endpoint = "https://revad-partner"
enable_webapp = true

[http.services.ocdav]
address = ":443"
insecure = true
public_url = "https://revad-partner"
files_namespace = "/home"

# The graph API, which is how the CLI learns who it is authenticated as.
[http.services.ocgraph]
address = ":443"
base_url = "https://revad-partner"
# Without this, sharedWithMe silently leaves federated shares out.
ocm_enabled = true

[http.services.ocs]
address = ":443"
prefix = "ocs"
share_prefix = "/"
home_namespace = "/home"

[http.services.ocs.config]
version = "1.8"
website = "reva"
host = "https://revad-partner"
contact = "partner@example.org"
ssl = "false"

[http.services.ocs.capabilities.capabilities.core]
poll_interval = 60
webdav_root = "remote.php/webdav"
status = { installed = true, maintenance = false, needsDbUpgrade = false, version = "10.0.11.5", versionstring = "10.0.11", edition = "community", productname = "reva", hostname = "" }

[http.services.ocs.capabilities.capabilities.files_sharing]
api_enabled = true
federation = { outgoing = true, incoming = true }

[http.middlewares.log]
level = "debug"
